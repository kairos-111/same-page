[project]
name = "same-page"
version = "0.10.2"
description = "Same Page: offline live captions and translation (English, Russian, mixed to Simplified Chinese) with local Whisper and Hy-MT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "whisperlivekit[mlx-whisper]==0.2.26",
  "imageio-ffmpeg>=0.6.0",
  "psutil>=7.0",
  "httpx>=0.28,<1",
  "opencc-python-reimplemented==0.1.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
