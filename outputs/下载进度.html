<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>课堂翻译 · 下载进度</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#18252a;background:#f1f4f3}*{box-sizing:border-box}body{margin:0;padding:32px 22px}main{max-width:820px;margin:auto}.eyebrow{font-size:12px;letter-spacing:2px;color:#50786c}h1{font-size:30px;margin:10px 0}.intro{font-size:14px;line-height:1.8;color:#60716a}.summary{margin:25px 0;background:#173e34;color:white;border-radius:20px;padding:25px}.big{font-size:42px;font-variant-numeric:tabular-nums;letter-spacing:-1px}.summary p{color:#c0d6cc;margin:6px 0;font-size:13px}.track{height:7px;border-radius:10px;background:#e7eeea;overflow:hidden;margin-top:15px}.fill{height:100%;background:#2d9c76;border-radius:10px;transition:width .5s}.summary .track{background:#34584d}.summary .fill{background:#a9e0c3}.card{background:white;border:1px solid #e0e8e3;border-radius:16px;padding:20px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:15px;font-weight:600}.badge{font-size:11px;color:#30795c;background:#edf7f0;border-radius:20px;padding:5px 9px;white-space:nowrap}.numbers{font-size:13px;color:#61716b;margin-top:11px;font-variant-numeric:tabular-nums}.smallrow{padding:13px 0;border-bottom:1px solid #eff2ef;font-size:13px}.smallrow:last-child{border:0}.muted{color:#738079;font-size:12px}h2{font-size:16px;margin:28px 0 13px}pre{white-space:pre-wrap;word-break:break-all;font-size:11px;line-height:1.8;color:#68786f;background:#e9efeb;border-radius:12px;padding:14px}footer{margin:20px 0;color:#75847b;font-size:11px;line-height:1.9}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#56b18b;margin-right:6px}.err{color:#ac593e}
</style>
<main><div class="eyebrow">LOCAL CLASSROOM TRANSLATOR</div><h1>下载与部署进度</h1><p class="intro">每 3 秒读取本机实际文件状态。模型下载完成后进行环境安装与端到端测试。</p>
<div class="summary"><div class="row"><div><div class="muted" style="color:#b4d1c3">三个模型总体进度</div><div class="big" id="percent">—</div></div><div id="amount">正在读取…</div></div><div class="track"><div class="fill" id="overall" style="width:0"></div></div><p id="speed">首次读取实际进度…</p></div>
<div id="models"></div><h2>运行环境与辅助文件</h2><div class="card" id="extras"></div><p class="muted" id="dependency"></p><details><summary class="muted">下载日志</summary><pre id="logs"></pre></details><footer><span class="dot"></span><span id="updated">连接本机下载服务…</span><br>仅在本机提供此页面 · 模型总计约 3.23 GB，运行环境和依赖另外统计。速度为窗口估算，首次下载和网络波动会影响它。</footer></main>
<script>
const $=id=>document.getElementById(id);const size=n=>n>=1e9?(n/1e9).toFixed(2)+' GB':(n/1e6).toFixed(1)+' MB';let history=[];
async function refresh(){try{const r=await fetch('http://127.0.0.1:8766/state',{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json();const n=d.items.reduce((a,x)=>a+x.downloaded,0),t=d.items.reduce((a,x)=>a+x.total,0),p=100*n/t;history.push([Date.now(),n]);history=history.filter(x=>Date.now()-x[0]<60000);$('percent').textContent=p.toFixed(1)+'%';$('amount').textContent=size(n)+' / '+size(t);$('overall').style.width=p+'%';if(history.length>1){const [when,before]=history[0];const v=(n-before)/((Date.now()-when)/1000);$('speed').textContent=p>=100?'三个模型下载完成，正在核对部署条件':v>0?'近一分钟模型合计速度约 '+size(v)+'/秒':'连接或校验中；已下载数据保留';}const cards=d.items.map(x=>{const c=document.createElement('div');c.className='card';const row=document.createElement('div');row.className='row';const title=document.createElement('div');title.className='title';title.textContent=x.title;const badge=document.createElement('span');badge.className='badge';badge.textContent=x.status;row.append(title,badge);const numbers=document.createElement('div');numbers.className='numbers';numbers.textContent=size(x.downloaded)+' / '+size(x.total)+'　'+(100*x.downloaded/x.total).toFixed(1)+'%';const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=100*x.downloaded/x.total+'%';track.append(fill);c.append(row,numbers,track);return c});$('models').replaceChildren(...cards);$('extras').replaceChildren(...d.extras.map(x=>{const el=document.createElement('div');el.className='row smallrow';const a=document.createElement('span');a.textContent=x.title;const b=document.createElement('span');b.className='muted';b.textContent=x.status+' · '+size(x.downloaded);el.append(a,b);return el}));$('dependency').textContent=d.dependency_detail;$('logs').textContent=d.logs.join('\n');$('updated').textContent='自动更新中 · '+d.updated;}catch(e){$('updated').textContent='无法连接本机进度服务，请保持下载进程运行';$('updated').className='err';}}
refresh();setInterval(refresh,3000);
</script></html>
